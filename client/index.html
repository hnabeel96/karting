<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f5a35">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Karting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
  /* Layout: full-bleed 3D stage; HUD pinned to the corners, thumbs own the bottom corners. */
  :root {
    --ink: #3b2412;        /* outlines and text on light chips */
    --mango: #ff9a1f;      /* main accent: buttons, counters */
    --mango-deep: #d9620b;
    --cream: #fff4dc;
    --jungle: #1f5a35;
    --stone: rgba(52, 38, 24, 0.55);
    --gold: #ffc23d;
    --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #7cc8f2; color: var(--cream); }
  [hidden] { display: none !important; }
  body {
    font-family: var(--body);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }

  /* speed lines during a boost */
  #speedlines {
    position: fixed; inset: -10%; pointer-events: none; opacity: 0;
    transition: opacity 0.25s;
    background: repeating-conic-gradient(from 0deg at 50% 55%, rgba(255,255,255,0.0) 0deg 4deg, rgba(255,255,255,0.55) 4.3deg 4.6deg, rgba(255,255,255,0) 5deg 9deg);
    -webkit-mask-image: radial-gradient(ellipse at 50% 55%, transparent 38%, #000 75%);
            mask-image: radial-gradient(ellipse at 50% 55%, transparent 38%, #000 75%);
    animation: spin 0.5s linear infinite;
  }
  @keyframes spin { to { transform: rotate(6deg); } }

  /* ---------- HUD */
  .hud { position: fixed; display: none; z-index: 5; }
  body.playing .hud { display: flex; }
  #counters {
    top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px));
    gap: 10px; align-items: center; pointer-events: none;
  }
  .chip {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px 4px 6px; border-radius: 999px;
    background: var(--stone); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    font: 26px/1 var(--display); color: var(--cream);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 0 rgba(0,0,0,0.35);
  }
  .chip svg { width: 32px; height: 32px; flex: none; }
  .chip small { font: 16px/1 var(--display); opacity: 0.7; margin-left: 1px; }
  .bump { animation: bump 0.32s cubic-bezier(.3,1.8,.5,1); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.28); } 100% { transform: scale(1); } }
  #juiced {
    font: 18px/1 var(--display); letter-spacing: 0.06em; color: var(--ink);
    background: var(--gold); padding: 7px 12px; border-radius: 999px;
    box-shadow: 0 3px 0 var(--mango-deep);
    animation: glow 0.9s ease-in-out infinite alternate;
  }
  @keyframes glow { to { box-shadow: 0 3px 0 var(--mango-deep), 0 0 18px 4px rgba(255,194,61,0.8); } }

  #corner {
    top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
    gap: 8px;
  }
  .round {
    width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0;
    display: grid; place-items: center; cursor: pointer;
    background: var(--stone); color: var(--cream);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .round svg { width: 22px; height: 22px; }
  .round:focus-visible, #play:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  #mute .x { display: none; }
  #mute.off .x { display: block; }
  #mute.off .w { display: none; }

  #callout {
    position: fixed; left: 50%; top: 22%; z-index: 6; pointer-events: none;
    font: 54px/1 var(--display); color: var(--cream); white-space: nowrap;
    -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill;
    text-shadow: 0 5px 0 var(--ink);
    transform: translate(-50%, 0) scale(0); opacity: 0;
  }
  #callout.show { animation: pop 0.9s cubic-bezier(.2,1.6,.4,1) forwards; }
  #callout.lv1 { color: #ffd27a; }
  #callout.lv2 { color: #ff8fa0; }
  #callout.lv3 { color: #c9a6ff; }
  #callout.juiced { color: var(--gold); }
  #callout.miss { font-size: 30px; color: #e8ddd0; -webkit-text-stroke-width: 1.5px; text-shadow: 0 3px 0 var(--ink); }
  @keyframes pop {
    0% { transform: translate(-50%, 0) scale(0.2) rotate(-8deg); opacity: 0; }
    18% { transform: translate(-50%, 0) scale(1.15) rotate(-3deg); opacity: 1; }
    30% { transform: translate(-50%, 0) scale(1) rotate(-3deg); }
    75% { opacity: 1; }
    100% { transform: translate(-50%, -30px) scale(0.95) rotate(-3deg); opacity: 0; }
  }

  #flyers { position: fixed; inset: 0; pointer-events: none; z-index: 6; }
  .flyer {
    position: absolute; left: 0; top: 0; width: 36px; height: 36px; margin: -18px 0 0 -18px;
    transition: transform 0.55s cubic-bezier(.5,-0.3,.6,1), opacity 0.55s;
  }
  .flyer svg { width: 100%; height: 100%; }

  /* ---------- touch controls */
  #controls { position: fixed; inset: 0; z-index: 4; display: none; }
  body.playing #controls { display: block; }
  #steer-zone, #drift-zone { position: absolute; top: 0; bottom: 0; }
  #steer-zone { left: 0; width: 46%; }
  #drift-zone { right: 0; width: 54%; }

  #steer-pill {
    position: fixed; width: 132px; height: 52px; border-radius: 999px;
    left: calc(110px + env(safe-area-inset-left, 0px)); top: calc(100% - 78px - env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, -50%);
    background: rgba(52, 38, 24, 0.35); border: 2px solid rgba(255, 244, 220, 0.35);
    pointer-events: none; transition: opacity 0.2s, background 0.2s;
    opacity: 0.75;
  }
  #steer-pill.active { background: rgba(52, 38, 24, 0.5); opacity: 1; transition: none; }
  #steer-pill .arrow { position: absolute; top: 50%; width: 0; height: 0; border: 8px solid transparent; transform: translateY(-50%); opacity: 0.7; }
  #steer-pill .l { left: 10px; border-right: 10px solid var(--cream); border-left: 0; }
  #steer-pill .r { right: 10px; border-left: 10px solid var(--cream); border-right: 0; }
  #steer-knob {
    position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; border-radius: 50%;
    background: var(--cream); box-shadow: 0 3px 0 rgba(59,36,18,0.45);
    transform: translate(-50%, -50%);
  }

  #drift-btn {
    position: fixed; right: calc(28px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    width: 112px; height: 112px; pointer-events: none;
    --next: #ffb02e;
  }
  #drift-btn .face {
    position: absolute; inset: 19px; border-radius: 50%;
    background: var(--mango); box-shadow: 0 6px 0 var(--mango-deep), inset 0 -6px 0 rgba(0,0,0,0.12);
    display: grid; place-items: center; transition: transform 0.06s, box-shadow 0.06s, background 0.1s;
    opacity: 0.88;
  }
  #drift-btn .face svg { width: 40px; height: 40px; }
  #drift-btn.down .face { transform: translateY(5px); box-shadow: 0 1px 0 var(--mango-deep), inset 0 -4px 0 rgba(0,0,0,0.12); opacity: 1; }
  #drift-btn.hot .face { background: var(--next); }
  #drift-btn.late .face { background: #8a7f76; }
  #drift-btn svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  #drift-btn .track { fill: none; stroke: rgba(52,38,24,0.4); stroke-width: 7; }
  #drift-btn .win { fill: none; stroke: rgba(255,244,220,0.55); stroke-width: 7; }
  #drift-btn #charge-ring { fill: none; stroke: var(--cream); stroke-width: 7; stroke-linecap: round; stroke-dasharray: 276.46; stroke-dashoffset: 276.46; }
  #drift-btn.hot #charge-ring { stroke: var(--next); }
  #drift-btn.late #charge-ring { stroke: #5c534c; }
  #pips { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); display: flex; gap: 6px; }
  #pips i { width: 12px; height: 12px; border-radius: 50%; background: rgba(52,38,24,0.45); border: 2px solid rgba(255,244,220,0.5); }
  #pips i.on:nth-child(1) { background: #ffb02e; }
  #pips i.on:nth-child(2) { background: #ff4f6d; }
  #pips i.on:nth-child(3) { background: #a66bff; }

  /* ---------- title screen */
  #title {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; padding: calc(5vh + env(safe-area-inset-top, 0px)) 16px calc(6vh + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(31,90,53,0.7), rgba(31,90,53,0) 40%), linear-gradient(to bottom, rgba(31,90,53,0.35), rgba(31,90,53,0) 30%);
  }
  body.playing #title { display: none; }
  #title .spacer { flex: 1; }
  #title h1 {
    margin: 0; font: clamp(56px, min(13vw, 22vh), 128px)/0.9 var(--display); letter-spacing: 0.01em;
    color: var(--mango); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
    text-shadow: 0 8px 0 var(--ink), 0 14px 24px rgba(0,0,0,0.25);
    transform: rotate(-4deg);
    text-wrap: balance;
  }
  #title h1 span { color: var(--gold); }
  .arena-tag {
    font: 15px/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--cream); background: var(--stone); padding: 8px 14px; border-radius: 999px;
  }
  .track-pick { display: flex; align-items: center; gap: 8px; }
  .track-pick .arrow {
    width: 40px; height: 40px; border: 0; border-radius: 50%; cursor: pointer; padding: 0;
    font: 16px/1 var(--display); color: var(--cream); background: rgba(31,74,46,0.75);
  }
  .track-pick .arrow:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .track-pick .arena-tag { min-width: 12em; text-align: center; }
  .tracks { display: flex; flex-wrap: wrap; gap: 8px; }
  .tracks .btn[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
  .tracks .btn .laps { font: 800 11px/1 var(--body); letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.7; margin-left: 6px; }
  #play {
    font: 34px/1 var(--display); letter-spacing: 0.04em; color: var(--ink);
    background: var(--gold); border: 0; border-radius: 22px; padding: 18px 54px 20px;
    box-shadow: 0 8px 0 var(--mango-deep), 0 14px 22px rgba(0,0,0,0.25);
    cursor: pointer; transition: transform 0.08s, box-shadow 0.08s;
    animation: breathe 1.6s ease-in-out infinite;
  }
  #play:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--mango-deep); animation: none; }
  body:not(.ready) #play { opacity: 0.5; pointer-events: none; animation: none; }
  @keyframes breathe { 50% { transform: scale(1.05); } }
  .keys { font: 700 13px/1.4 var(--body); color: rgba(255,244,220,0.8); text-align: center; }
  .keys kbd { font: 900 12px/1 var(--body); background: rgba(255,244,220,0.18); padding: 3px 6px; border-radius: 5px; }
  @media (hover: none) { .keys { display: none; } }

  /* ---------- race HUD */
  #race-hud { top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); gap: 12px; align-items: flex-start; pointer-events: none; }
  body.racing #counters { left: auto; right: calc(150px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); }
  body.racing #crate-box { display: none; }
  #place {
    font: 64px/0.85 var(--display); color: var(--cream);
    -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink);
    font-variant-numeric: tabular-nums;
  }
  #place sup { font-size: 0.42em; vertical-align: top; margin-left: 2px; }
  #place small { font-size: 0.38em; opacity: 0.85; margin-left: 4px; }
  #place.first { color: var(--gold); }
  .race-lines { display: flex; flex-direction: column; gap: 6px; padding-top: 4px; }
  .race-lines .chip { font-size: 20px; padding: 5px 12px; }
  #timer { font-variant-numeric: tabular-nums; }
  #minimap {
    position: fixed; z-index: 5; display: none; pointer-events: none;
    top: calc(62px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
    width: 132px; height: 132px; border-radius: 16px; background: rgba(52, 38, 24, 0.42);
  }
  body.racing #minimap { display: block; }
  #wrongway, #spectate {
    position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 6; pointer-events: none;
    font: 40px/1 var(--display); color: #ffe1d6; -webkit-text-stroke: 2px #7a1d12; paint-order: stroke fill; text-shadow: 0 4px 0 #7a1d12;
    animation: blink 0.6s steps(2, start) infinite;
  }
  #spectate { top: 18%; font-size: 22px; color: var(--cream); -webkit-text-stroke: 0; text-shadow: 0 2px 0 rgba(0,0,0,0.4); animation: none; background: var(--stone); padding: 8px 16px; border-radius: 999px; white-space: nowrap; }
  @keyframes blink { to { visibility: hidden; } }
  #countdown {
    position: fixed; left: 50%; top: 40%; z-index: 7; pointer-events: none;
    font: 150px/1 var(--display); color: var(--gold); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 var(--ink);
    transform: translate(-50%, -50%);
  }
  #countdown.go { color: #7be36b; }
  #countdown.tick { animation: count 0.9s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes count { 0% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; } 25% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(0.85); opacity: 0; } }

  /* ---------- panels: lobby and results */
  .panel {
    position: fixed; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: rgba(20, 52, 32, 0.45);
  }
  .card {
    width: min(620px, 100%); max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #1f4a2e; color: var(--cream); border-radius: 22px; padding: 18px 20px;
    box-shadow: 0 8px 0 #12301d, 0 18px 40px rgba(0,0,0,0.35);
    display: flex; flex-direction: column; gap: 14px; touch-action: pan-y; user-select: text; -webkit-user-select: text;
  }
  .card h2 { margin: 0; font: 34px/1 var(--display); color: var(--gold); text-wrap: balance; }
  .card p { margin: 0; font: 700 15px/1.45 var(--body); color: rgba(255,244,220,0.85); max-width: 60ch; }
  .card .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .card .grow { flex: 1 1 160px; min-width: 0; }
  .join-url { font: 900 18px/1.2 var(--body); color: var(--cream); background: rgba(0,0,0,0.22); padding: 8px 12px; border-radius: 10px; word-break: break-all; user-select: all; -webkit-user-select: all; }
  .card label { font: 800 13px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,244,220,0.7); }
  #name-input {
    font: 22px/1 var(--display); color: var(--ink); background: var(--cream); border: 0; border-radius: 12px; padding: 10px 12px; width: 100%;
  }
  #name-input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; padding: 0; cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.18); }
  .swatch[aria-pressed="true"] { border-color: var(--cream); }
  .swatch:disabled { opacity: 0.25; cursor: default; }
  .players { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .players li { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.2); border-radius: 12px; padding: 8px 10px; font: 18px/1.1 var(--display); min-width: 0; }
  .players li .dot { width: 16px; height: 16px; border-radius: 50%; flex: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2); }
  .players li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .players li .tag { font: 800 11px/1 var(--body); text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; }
  .players li.you { outline: 2px solid var(--gold); }
  .btn {
    font: 22px/1 var(--display); letter-spacing: 0.02em; border: 0; border-radius: 14px; padding: 12px 18px 14px; cursor: pointer;
    background: var(--cream); color: var(--ink); box-shadow: 0 5px 0 rgba(0,0,0,0.3); transition: transform 0.06s, box-shadow 0.06s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,0.3); }
  .btn.go { background: var(--gold); box-shadow: 0 5px 0 var(--mango-deep); font-size: 28px; padding: 14px 28px 16px; }
  .btn.quiet { background: rgba(255,244,220,0.14); color: var(--cream); box-shadow: none; }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .results { width: 100%; border-collapse: collapse; font: 20px/1.2 var(--display); font-variant-numeric: tabular-nums; }
  .results td { padding: 8px 6px; border-bottom: 1px solid rgba(255,244,220,0.12); }
  .results td.pl { width: 3.2em; color: var(--gold); }
  .results td.tm { text-align: right; white-space: nowrap; }
  .results td.bl { text-align: right; font: 800 13px/1.2 var(--body); opacity: 0.75; white-space: nowrap; }
  .results tr.you td { color: var(--gold); }
  .results .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
  .status { font: 800 15px/1.4 var(--body); color: #ffd27a; }

  .lobby-card { width: min(860px, 100%); }
  .lobby-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .lobby-grid .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .lobby-grid .col label { margin-top: 4px; }
  .btn.small { font-size: 17px; padding: 9px 14px 11px; }
  #start-race { margin-top: auto; }
  @media (min-width: 620px) {
    .lobby-grid { grid-template-columns: 1fr 1fr; }
    .players { grid-template-columns: 1fr 1fr; }
  }
  @media (max-height: 460px) {
    .card { padding: 12px 16px; gap: 10px; border-radius: 18px; }
    .card h2 { font-size: 26px; }
    .join-url { font-size: 15px; padding: 6px 10px; }
    #name-input { font-size: 18px; padding: 7px 10px; }
    .swatch { width: 28px; height: 28px; }
    .players li { padding: 5px 8px; font-size: 16px; }
    .btn.go { font-size: 24px; padding: 10px 22px 12px; }
  }

  /* title buttons */
  .menu { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }
  .linkish { background: none; border: 0; color: var(--cream); font: 800 15px/1 var(--body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px; }

  /* phones held upright */
  #rotate {
    position: fixed; inset: 0; z-index: 20; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #1f5a35; color: var(--cream); font: 24px/1.2 var(--display); text-align: center; padding: 0 24px;
  }
  #rotate svg { width: 84px; height: 84px; animation: tilt 1.8s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (hover: none) and (max-width: 820px) {
    body.playing #rotate { display: flex; }
  }

  @media (prefers-reduced-motion: reduce) {
    #play, #speedlines, #juiced, #rotate svg, #wrongway, #countdown.tick { animation: none; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/", "@shared/": "../shared/" } }
</script>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="mangoFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23a"/><stop offset="1" stop-color="#ff5d2a"/>
    </linearGradient>
    <symbol id="mango" viewBox="0 0 24 24">
      <path d="M12 5c5 0 8 4 7.5 8.5C19 18 15.5 21 11.5 21S4.5 18 4.6 13.6C4.7 9 7.4 5 12 5z" fill="url(#mangoFill)" stroke="#3b2412" stroke-width="1.4"/>
      <path d="M12.2 5.4c.6-1.8 2.4-3 4.8-2.6-.6 2.2-2.4 3.2-4.8 2.6z" fill="#3faa3a" stroke="#3b2412" stroke-width="1.1"/>
      <ellipse cx="9" cy="10" rx="1.6" ry="2.4" fill="#fff" opacity=".55"/>
    </symbol>
  </defs>
</svg>

<div id="stage"></div>
<div id="speedlines"></div>

<div id="counters" class="hud">
  <div class="chip" id="fruit-box" aria-label="Mangoes collected">
    <svg viewBox="0 0 24 24"><use href="#mango"/></svg>
    <span id="fruit-count">0</span><small>/10</small>
  </div>
  <div class="chip" id="crate-box" aria-label="Crates smashed">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2" fill="#c07a37" stroke="#3b2412" stroke-width="1.4"/><path d="M4 5l16 15M20 5L4 20" stroke="#7a4519" stroke-width="2.2"/></svg>
    <span id="crate-count">0</span>
  </div>
  <div id="juiced" hidden>Juiced</div>
</div>

<div id="race-hud" class="hud" hidden>
  <div id="place">1<sup>st</sup><small>/2</small></div>
  <div class="race-lines">
    <div class="chip" id="lap">Lap 1/3</div>
    <div class="chip" id="timer">0:00.0</div>
  </div>
</div>
<canvas id="minimap" width="264" height="264" aria-hidden="true"></canvas>
<div id="wrongway" hidden>Wrong way!</div>
<div id="spectate" hidden>Race in progress. You're in the next one</div>
<div id="countdown" hidden></div>

<div id="corner" class="hud">
  <button class="round" id="home" aria-label="Back to the title screen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg>
  </button>
  <button class="round" id="mute" aria-label="Turn sound off" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg>
  </button>
</div>

<div id="callout"></div>
<div id="flyers"></div>

<div id="controls">
  <div id="steer-zone"></div>
  <div id="drift-zone"></div>
  <div id="steer-pill"><span class="arrow l"></span><span class="arrow r"></span><div id="steer-knob"></div></div>
  <div id="drift-btn">
    <svg class="ring" viewBox="0 0 112 112" aria-hidden="true">
      <circle class="track" cx="56" cy="56" r="44"/>
      <circle class="win" cx="56" cy="56" r="44" stroke-dasharray="82.94 276.46" stroke-dashoffset="-193.52"/>
      <circle id="charge-ring" cx="56" cy="56" r="44"/>
    </svg>
    <div class="face">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3b2412" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18c0-6 4-10 11-10"/><path d="M13 4.5L16.5 8 13 11.5"/><path d="M4 21h4" opacity=".6"/></svg>
    </div>
    <div id="pips"><i></i><i></i><i></i></div>
  </div>
</div>

<div id="title">
  <h1>Kart<span>ing</span></h1>
  <div class="track-pick">
    <button class="arrow" id="track-prev" aria-label="Previous track">&#9664;</button>
    <div class="arena-tag" id="track-name" aria-live="polite">Temple Circuit</div>
    <button class="arrow" id="track-next" aria-label="Next track">&#9654;</button>
  </div>
  <div class="spacer"></div>
  <div class="menu">
    <button id="play">Race a friend</button>
    <button class="btn" id="race-bots">Race bots</button>
  </div>
  <div class="menu">
    <button class="linkish" id="free-drive">Free drive in the courtyard</button>
    <button class="linkish" id="install" hidden>Install on this phone</button>
  </div>
  <div class="keys"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> steer &nbsp;&middot;&nbsp; hold <kbd>Space</kbd> to drift &nbsp;&middot;&nbsp; let go and press again when the ring glows to boost</div>
</div>

<div id="lobby" class="panel" hidden>
  <div class="card lobby-card" role="dialog" aria-labelledby="lobby-title">
    <div class="row">
      <h2 id="lobby-title" class="grow">Race a friend</h2>
      <button class="btn quiet" id="lobby-leave">Back</button>
    </div>
    <p id="lobby-status" class="status">Connecting to the game server&hellip;</p>
    <div id="lobby-body" class="lobby-grid" hidden>
      <div class="col">
        <label for="join-url">Friends open this on their phone</label>
        <div class="join-url" id="join-url"></div>
        <label for="name-input">Your name</label>
        <input id="name-input" maxlength="14" autocomplete="nickname" spellcheck="false">
        <label>Kart colour</label>
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="col">
        <label>Track</label>
        <div class="tracks" id="tracks"></div>
        <label>On the grid</label>
        <ul class="players" id="players"></ul>
        <div class="row">
          <button class="btn quiet small" id="bot-add">Add bot</button>
          <button class="btn quiet small" id="bot-remove">Remove bot</button>
        </div>
        <button class="btn go" id="start-race">Start race</button>
      </div>
    </div>
  </div>
</div>

<div id="results" class="panel" hidden>
  <div class="card" role="dialog" aria-labelledby="results-title">
    <h2 id="results-title">Results</h2>
    <table class="results"><tbody id="results-rows"></tbody></table>
    <p id="results-note"></p>
    <div class="row">
      <button class="btn quiet" id="results-back">Back</button>
      <span class="grow"></span>
      <button class="btn go" id="results-again">Race again</button>
    </div>
  </div>
</div>

<div id="rotate">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
  Turn your phone sideways
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
